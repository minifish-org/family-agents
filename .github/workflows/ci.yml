name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: make build test vet race smoke
      - run: CGO_ENABLED=0 go test -tags goolm ./...
      - run: git diff --exit-code
